name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p _site
          cat > version.js <<EOF
          (function () {
            "use strict";

            window.WorkoutVersion = {
              label: "deploy ${SHORT_SHA}",
              sha: "${GITHUB_SHA}"
            };
          })();
          EOF
          cp index.html style.css config.js seed.js supabaseClient.js app.js version.js _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
